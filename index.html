<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weibull Analysis Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- WP-safe UMD build -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; }

body{
  font-family: Arial, system-ui, sans-serif;
  margin:20px;
  background:#ffffff;
  color:#000;
}

/* ===== Cards ===== */
.card{
  background:#F2F2F2;
  border:1px solid #e2e2e2;
  border-radius:14px;
  padding:22px 24px 18px;
  margin:16px 0;
}
.card h3{
  margin:0 0 14px 0;
  font-size:1.1rem;
  font-weight:700;
}

/* ===== Inputs ===== */
label{ font-weight:600; margin-top:14px; margin-bottom:6px; display:block; }

textarea,input[type="number"]{
  width:100%;
  padding:10px 12px;
  border-radius:8px;
  border:1px solid #d0d0d0;
  background:#fff;
  font-family:inherit;
}
textarea{ min-height:90px; }

/* ===== Buttons ===== */
button{
  padding:10px 16px;
  font-weight:700;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:#000;
  color:#fff;
}
button:hover{ opacity:.9; }

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  margin-top:12px;
}
#msg{ margin-left:8px; }

/* ===== Tabs ===== */
.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px;
  margin-bottom:10px;
}
.tabs button{
  background:#fff;
  color:#000;
  border:1px solid #d0d0d0;
  border-radius:999px;
  padding:8px 14px;
  font-weight:600;
}
.tabs button.active{
  background:#000;
  color:#fff;
  border-color:#000;
}

/* ===== Results table (LOCKED) ===== */
#out table{
  width:100%;
  table-layout:fixed;
  border-collapse:collapse;
  margin-top:10px;
}
#out th,#out td{
  padding:8px 10px;
  border-bottom:1px solid #ddd;
  text-align:left;
  vertical-align:middle;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#out th{ background:#fff; font-weight:700; }
#out th:nth-child(1), #out td:nth-child(1){ width:40%; }
#out th:nth-child(2), #out td:nth-child(2){ width:60%; }

/* ===== Plot panels ===== */
.panel{ display:none; }
.panel.active{ display:block; }

.plot-title{
  font-weight:700;
  margin:8px 0 4px;
  text-align:center;
  font-size:15px;
}

/* ===== Fixed height charts (WP-safe) ===== */
.chart-wrap{
  height:1000px;
  width:100%;
  position:relative;
}

canvas{
  display:block !important;
  width:100% !important;
  height:100% !important;
  background:#fff;
  border:1px solid #e2e2e2;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- ================= DATA ENTRY ================= -->
<div class="card">
  <h3>Data Entry</h3>

  <label>Failure times</label>
  <textarea id="fail" placeholder="Enter failure times separated by commas or spaces"></textarea>

  <label>Suspensions (optional)</label>
  <textarea id="susp" placeholder="Enter suspension times (optional)"></textarea>

  <div style="margin-top:10px">
    <label><input type="radio" name="m" value="rroy" checked> Rank Regression on Y</label>
    <label><input type="radio" name="m" value="rrox"> Rank Regression on X</label>
    <label><input type="radio" name="m" value="mle"> Maximum Likelihood Estimation</label>
  </div>

  <div style="margin-top:10px">
    <label><input type="checkbox" id="kmToggle"> Show Kaplan–Meier Survival Curve</label>
  </div>

  <div class="actions">
    <button id="run" type="button">Calculate</button>
    <button id="clearData" type="button">Clear Data</button>
    <span id="msg"></span>
  </div>
</div>

<!-- ================= RESULTS ================= -->
<div class="card">
  <h3>Results</h3>
  <div id="out">
    <table>
      <thead><tr><th>Metric</th><th>Value</th></tr></thead>
      <tbody>
        <tr><td>Method</td><td></td></tr>
        <tr><td>β (Shape)</td><td></td></tr>
        <tr><td>η (Scale)</td><td></td></tr>
        <tr><td>MTTF</td><td></td></tr>
        <tr><td>Anderson–Darling A²</td><td></td></tr>
        <tr><td>Goodness of Fit</td><td></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ================= RELIABILITY ================= -->
<div class="card">
  <h3>Reliability at Specific Time</h3>
  <div class="actions">
    <input type="number" id="timeInput" placeholder="Time" style="max-width:220px;">
    <button id="calcRel" type="button">Calculate Reliability</button>
  </div>
  <div id="relOut" style="margin-top:10px;font-weight:600"></div>
</div>

<!-- ================= PLOTS ================= -->
<div class="card">
  <h3>Plots</h3>

  <div class="tabs">
    <button type="button" data-target="pdf" class="active">PDF</button>
    <button type="button" data-target="cdf">CDF</button>
    <button type="button" data-target="rel">Reliability</button>
    <button type="button" data-target="haz">Hazard</button>
    <button type="button" data-target="weibplot">Weibull Probability Plot</button>
  </div>

  <div id="panel-pdf" class="panel active">
    <div class="plot-title" id="pdf-title">Probability Density Function</div>
    <div class="chart-wrap"><canvas id="pdf"></canvas></div>
  </div>

  <div id="panel-cdf" class="panel">
    <div class="plot-title" id="cdf-title">Cumulative Distribution Function</div>
    <div class="chart-wrap"><canvas id="cdf"></canvas></div>
  </div>

  <div id="panel-rel" class="panel">
    <div class="plot-title" id="rel-title">Reliability Function</div>
    <div class="chart-wrap"><canvas id="rel"></canvas></div>
  </div>

  <div id="panel-haz" class="panel">
    <div class="plot-title" id="haz-title">Hazard Rate Function</div>
    <div class="chart-wrap"><canvas id="haz"></canvas></div>
  </div>

  <div id="panel-weibplot" class="panel">
    <div class="plot-title" id="weibplot-title">Weibull Probability Plot</div>
    <div class="chart-wrap"><canvas id="weibplot"></canvas></div>
  </div>

  <div class="actions">
    <button id="exportBtn" type="button">Download Plot</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  if (typeof Chart === "undefined") {
    const msg = document.getElementById("msg");
    if (msg) msg.textContent = "⚠ Chart.js failed to load. Check CDN access.";
    return;
  }

  const byId = id => document.getElementById(id);
  const parseNums = s => (s||"")
    .split(/[\s,]+/)
    .map(Number)
    .filter(v => isFinite(v) && v > 0)
    .sort((a,b)=>a-b);

  const Fm = n => Array.from({length:n},(_,i)=>(i+1-0.3)/(n+0.4));
  const FtoY = F => Math.log(-Math.log(1-F));

  let charts = {};
  let lastParams = null;
  const panels = ["pdf","cdf","rel","haz","weibplot"];

  function destroyChart(id){
    const c = byId(id);
    const ex = c ? Chart.getChart(c) : null;
    if (ex) ex.destroy();
  }

  // ✅ Proper tab toggle (panels switch in-place) + resize after reflow
  function showPanel(id){
    panels.forEach(p=>{
      const panelEl = byId(`panel-${p}`);
      const isActive = (p === id);
      if(panelEl) panelEl.classList.toggle("active", isActive);

      const tabBtn = document.querySelector(`.tabs button[data-target="${p}"]`);
      if(tabBtn) tabBtn.classList.toggle("active", isActive);

      if(isActive && charts[p]){
        requestAnimationFrame(() => {
          charts[p].resize();
          charts[p].update();
        });
      }
    });
  }

  // Gamma (Lanczos)
  function gamma(x){
    const p=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,
      -176.61502916214059,12.507343278686905,-0.13857109526572012,
      9.9843695780195716e-6,1.5056327351493116e-7];
    let g=7;
    if(x<0.5) return Math.PI/Math.sin(Math.PI*x)/gamma(1-x);
    x-=1;
    let a=p[0],t=x+g+0.5;
    for(let i=1;i<g+2;i++) a+=p[i]/(x+i);
    return Math.sqrt(2*Math.PI)*Math.pow(t,x+0.5)*Math.exp(-t)*a;
  }

  function linReg(X,Y){
    let sx=0,sy=0,sxx=0,sxy=0,n=X.length;
    for(let i=0;i<n;i++){ sx+=X[i]; sy+=Y[i]; sxx+=X[i]*X[i]; sxy+=X[i]*Y[i]; }
    const b=(n*sxy-sx*sy)/(n*sxx-sx*sx);
    const a=(sy-b*sx)/n;
    return {a,b};
  }

  // Rank Regression on Y (Weibull paper)
  function rrY(f){
    const n=f.length,F=Fm(n);
    const X=f.map(t=>Math.log(t)),Y=F.map(FtoY);
    const {a,b}=linReg(X,Y);
    return {m:"Rank Regression on Y", a, b, beta:b, eta:Math.exp(-a/b)};
  }

  // Rank Regression on X (Weibull paper)
  function rrX(f){
    const n=f.length,F=Fm(n);
    const X=F.map(FtoY),Y=f.map(t=>Math.log(t));
    const {a,b}=linReg(X,Y);
    return {m:"Rank Regression on X", a, b, beta:1/b, eta:Math.exp(a)};
  }

  // Anderson–Darling for fitted Weibull on failures (same as your original)
  function andersonDarlingWeibull(f,beta,eta){
    const n=f.length; if(n<2) return NaN;
    const z=f.map(t=>1-Math.exp(-Math.pow(t/eta,beta))).sort((a,b)=>a-b);
    let sum=0;
    for(let i=0;i<n;i++){
      sum += (2*(i+1)-1) * (Math.log(z[i]) + Math.log(1-z[n-i-1]));
    }
    const A2 = -n - sum/n;
    return A2*(1+0.6/n);
  }

  // MLE with censoring (failures + suspensions) (your original approach)
  function mle(f,c){
    const r=f.length, all=f.concat(c||[]), sumLn=f.reduce((s,t)=>s+Math.log(t),0);

    function sums(b){
      let C=0,B=0,B2=0,C1=0;
      for(const t of all){
        const lt=Math.log(t), tb=t**b;
        C+=tb; B+=tb*lt; B2+=tb*lt*lt; C1+=tb*lt;
      }
      return {C,B,B2,C1};
    }
    function g(b){ const {C,B}=sums(b); return r/b + sumLn - r*(B/C); }
    function g1(b){ const {C,B,B2,C1}=sums(b); return -r/(b*b) - r*((B2*C - B*C1)/(C*C)); }

    let b0 = rrY(f).beta; // good start
    for(let i=0;i<80;i++){
      const gb=g(b0), gp=g1(b0);
      if(!isFinite(gb)||!isFinite(gp)||gp===0) break;
      const next=b0-gb/gp;
      if(Math.abs(next-b0)<1e-8*Math.max(1,b0)){ b0=next; break; }
      b0=Math.min(Math.max(next,0.1),50);
    }
    const C = all.reduce((s,t)=>s+t**b0,0);
    const eta=(C/r)**(1/b0);
    return {m:"Maximum Likelihood Estimation", beta:b0, eta};
  }

  // Kaplan–Meier (failures + suspensions)
  function kaplanMeier(f,c){
    const events=f.map(t=>({t,e:1}));
    const cens=(c?.length?c:[]).map(t=>({t,e:0}));
    const data=events.concat(cens).sort((a,b)=>a.t-b.t);
    let n=data.length, R=1;
    const kmX=[0], kmY=[1];
    let i=0;
    while(i<data.length){
      const t=data[i].t; let d=0,w=0;
      while(i<data.length && data[i].t===t){ data[i].e?d++:w++; i++; }
      if(n>0) R*=1-d/n;
      kmX.push(t); kmY.push(R);
      n-=d+w;
    }
    return {kmX, kmY};
  }

  // Base options for fixed-height charts
  const baseOpts = () => ({
    responsive:true,
    maintainAspectRatio:false,   // 🔒 wrapper controls height (1000px)
    parsing:false,
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ type:"linear", title:{display:true,text:"Time"} },
      y:{ title:{display:true,text:"Value"} }
    }
  });

  function initBlankCharts(){
    ["pdf","cdf","rel","haz"].forEach(id=>{
      destroyChart(id);
      charts[id]=new Chart(byId(id),{
        type:"line",
        data:{datasets:[]},
        options:baseOpts()
      });
    });

    destroyChart("weibplot");
    charts.weibplot=new Chart(byId("weibplot"),{
      type:"scatter",
      data:{datasets:[]},
      options:{
        responsive:true,
        maintainAspectRatio:false,
        parsing:false,
        plugins:{legend:{display:false}}
      },
      scales:{
        x:{ type:"logarithmic", title:{display:true,text:"Time (log scale)"}, grid:{color:"#ddd"} },
        y:{ title:{display:true,text:"Unreliability F(t) (%)"} }
      }
    });
  }

  function drawLine(id, yLabel, X, Y, datasetsExtra=null, legend=false){
    destroyChart(id);
    charts[id]=new Chart(byId(id),{
      type:"line",
      data:{
        datasets:[
          ...(datasetsExtra ? datasetsExtra : [{
            data:X.map((t,i)=>({x:t,y:Y[i]})),
            borderColor:"#000",
            backgroundColor:"#000",
            borderWidth:2,
            fill:false,
            tension:.1,
            pointRadius:0
          }])
        ]
      },
      options:{
        ...baseOpts(),
        plugins:{
          legend:{
            display: !!legend,
            labels:{ usePointStyle:true, pointStyle:'rectFilled' }
          }
        },
        scales:{
          x:{ type:"linear", title:{display:true,text:"Time"} },
          y:{ title:{display:true,text:yLabel} }
        }
      }
    });
  }

  function weibullProbabilityPlot(f, beta, eta){
    const n=f.length;
    const F=Fm(n);
    const pts=f.map((t,i)=>({x:t,y:FtoY(F[i])}));

    // Fit line in Weibull paper coords: Y = a + b*ln(t)
    const a = -beta*Math.log(eta);
    const b = beta;

    const line=[];
    const tmin=eta*Math.pow(-Math.log(1-0.001),1/beta);
    const tmax=eta*Math.pow(-Math.log(1-0.9999),1/beta);
    for(let t=tmin;t<=tmax;t*=1.02) line.push({x:t,y:a+b*Math.log(t)});

    const etaLine=[{x:eta,y:FtoY(0.05)},{x:eta,y:FtoY(0.99)}];

    const Fy=[0.05,0.10,0.20,0.30,0.40,0.50,0.60,0.70,0.80,0.90,0.95,0.99];
    const Yticks=Fy.map(v=>({value:FtoY(v),label:(v*100).toFixed(0)}));

    destroyChart("weibplot");
    charts.weibplot=new Chart(byId("weibplot"),{
      type:"scatter",
      data:{datasets:[
        {label:"Data",data:pts,backgroundColor:"#000",pointRadius:3},
        {label:"Fit",data:line,type:"line",borderColor:"#2b6cb0",borderWidth:2,pointRadius:0},
        {label:"η",data:etaLine,type:"line",borderColor:"#C2965B",borderWidth:2,borderDash:[6,6],pointRadius:0}
      ]},
      options:{
        responsive:true,
        maintainAspectRatio:false,
        parsing:false,
        plugins:{legend:{display:false}},
        scales:{
          x:{type:"logarithmic",title:{display:true,text:"Time (log scale)"},grid:{color:"#ddd"}},
          y:{
            title:{display:true,text:"Unreliability F(t) (%)"},
            min:FtoY(0.05),
            max:FtoY(0.99),
            afterBuildTicks:(axis)=>{ axis.ticks = Yticks.map(t=>({value:t.value,label:t.label})); },
            ticks:{ callback:(v)=>{
              const t=Yticks.find(tt=>Math.abs(tt.value-v)<0.05);
              return t?t.label:"";
            }}
          }
        }
      }
    });
  }

  function updateResultsTable(methodLabel, beta, eta, mttf, ad, fit){
    const vals=[
      methodLabel,
      beta.toFixed(6),
      eta.toFixed(6),
      mttf.toFixed(6),
      isNaN(ad) ? "N/A" : ad.toFixed(4),
      fit
    ];
    byId("out").querySelectorAll("tbody td:nth-child(2)").forEach((cell,i)=>{
      cell.textContent = vals[i] ?? "";
    });
  }

  function run(){
    try{
      const f=parseNums(byId("fail").value);
      const c=parseNums(byId("susp").value);
      const m=document.querySelector('input[name="m"]:checked')?.value;

      if(!m) throw "Select a method.";
      if((m==="rroy"||m==="rrox") && f.length<2) throw "≥2 failures needed";
      if(m==="mle" && f.length<1) throw "≥1 failure needed";

      // ✅ compute beta/eta per method
      const r=(m==="rroy")?rrY(f):(m==="rrox")?rrX(f):mle(f,c);
      const beta=r.beta, eta=r.eta;

      if(!(isFinite(beta)&&isFinite(eta)&&beta>0&&eta>0)) throw "Invalid β/η produced (check input).";

      // Use 99.9% quantile for x range
      const t99 = eta * Math.pow(-Math.log(1 - 0.999), 1 / beta);
      const tmax = (t99>0 && isFinite(t99)) ? t99 : Math.max(...f,1);

      const X=[],pdf=[],cdf=[],rel=[],haz=[];
      for(let i=0;i<200;i++){
        const t=tmax*i*i/(199**2);
        const z=(t/eta)**beta;
        const R=Math.exp(-z);
        const f1=(beta/eta)*(t/eta)**(beta-1)*R;
        X.push(t);
        pdf.push(f1);
        cdf.push(1-R);
        rel.push(R);
        haz.push(f1/R);
      }

      // PDF/CDF/Hazard
      drawLine("pdf","PDF",X,pdf,null,false);
      drawLine("cdf","CDF",X,cdf,null,false);
      drawLine("haz","Hazard",X,haz,null,false);

      // Reliability with optional KM overlay
      const kmOn = byId("kmToggle").checked;
      const relDatasets = [];

      // Weibull curve
      relDatasets.push({
        label:"Weibull",
        data:X.map((t,i)=>({x:t,y:rel[i]})),
        borderColor:"#000",
        backgroundColor:"#000",
        borderWidth:2,
        fill:false,
        tension:.1,
        pointRadius:0
      });

      if(kmOn){
        const {kmX,kmY} = kaplanMeier(f,c);
        relDatasets.push({
          label:"Kaplan–Meier",
          data:kmX.map((t,i)=>({x:t,y:kmY[i]})),
          borderColor:"#C2965B",
          backgroundColor:"#C2965B",
          borderWidth:2,
          fill:false,
          tension:0,
          pointRadius:0
        });
      }

      destroyChart("rel");
      charts.rel = new Chart(byId("rel"),{
        type:"line",
        data:{datasets:relDatasets},
        options:{
          responsive:true,
          maintainAspectRatio:false,
          parsing:false,
          plugins:{
            legend:{
              display: kmOn, // show legend only when KM is present
              labels:{usePointStyle:true,pointStyle:'rectFilled'}
            }
          },
          scales:{
            x:{type:"linear",title:{display:true,text:"Time"}},
            y:{title:{display:true,text:"Reliability"},min:0,max:1}
          }
        }
      });

      // Weibull probability plot
      if(f.length >= 2){
        weibullProbabilityPlot(f,beta,eta);
      }else{
        destroyChart("weibplot");
        charts.weibplot = new Chart(byId("weibplot"),{type:"scatter",data:{datasets:[]},options:{responsive:true,maintainAspectRatio:false}});
      }

      // ✅ AD & GoF based on fitted beta/eta (failures only, same as your original)
      const mttf = eta * gamma(1+1/beta);
      const ad = (f.length>=2) ? andersonDarlingWeibull(f,beta,eta) : NaN;
      const fit = isNaN(ad) ? "N/A" : (ad<0.3?"Excellent":ad<0.6?"Good":ad<1?"Moderate":"Poor");

      updateResultsTable(r.m, beta, eta, mttf, ad, fit);

      lastParams = {beta, eta};
      byId("msg").textContent = "";
      byId("relOut").textContent = "";

      // keep current tab active + force resize after render
      const active = document.querySelector(".tabs button.active")?.dataset.target || "pdf";
      showPanel(active);

    }catch(e){
      byId("msg").textContent = "⚠ " + e;
    }
  }

  function calcReliability(){
    if(!lastParams){
      byId("relOut").textContent="⚠ Calculate parameters first.";
      return;
    }
    const t = parseFloat(byId("timeInput").value);
    if(!isFinite(t) || t<=0){
      byId("relOut").textContent="⚠ Enter valid time.";
      return;
    }
    const R = Math.exp(-Math.pow(t/lastParams.eta,lastParams.beta));
    byId("relOut").innerHTML = `Reliability at <b>${t}</b> = <b>${(R*100).toFixed(2)}%</b>`;
  }

  function clearAll(){
    byId("fail").value="";
    byId("susp").value="";
    Object.keys(charts).forEach(id=>destroyChart(id));
    byId("out").querySelectorAll("tbody td:nth-child(2)").forEach(c=>{ c.textContent=""; });
    byId("msg").textContent="";
    byId("relOut").textContent="";
    lastParams=null;
    initBlankCharts();
    showPanel("pdf");
  }

  // Bindings
  byId("run").addEventListener("click", run);
  byId("clearData").addEventListener("click", clearAll);
  byId("calcRel").addEventListener("click", calcReliability);

  document.querySelectorAll(".tabs button").forEach(btn=>{
    btn.addEventListener("click", ()=> showPanel(btn.dataset.target));
  });

  byId("exportBtn").addEventListener("click", () => {
    const active = document.querySelector(".tabs button.active")?.dataset.target;
    if(!active || !charts[active]) return alert("No active chart");
    const link = document.createElement("a");
    link.download = active + "_plot.png";
    link.href = charts[active].toBase64Image();
    link.click();
  });

  // Init
  initBlankCharts();
  showPanel("pdf");
});
</script>
<script>
  function sendHeight() {
    const height = document.documentElement.scrollHeight;
    parent.postMessage({ height: height }, "*");
  }

  // Send height on load
  window.addEventListener("load", sendHeight);

  // Send height on resize
  window.addEventListener("resize", sendHeight);

  // Send height when DOM changes (charts, toggles, results)
  const observer = new MutationObserver(sendHeight);
  observer.observe(document.body, {
    childList: true,
    subtree: true,
    attributes: true
  });
</script>
</body>
</html>
